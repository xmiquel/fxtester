schema: spec-driven
project: fxtester
strict_tdd: false
context: |
  Project: fxtester
  Workspace status: trading-terminal-foundation is completed and archived; all associated remediation is complete.
  Tech stack: Python 3.14 FastAPI + DuckDB backend, Node 22 Vite frontend scaffold, Docker Compose, and GitHub Actions.
  Architecture: read-only DuckDB candle-window API with one bounded React 19 Lightweight Charts view; chart rendering, typed query client, and older-window navigation were delivered in PR 2.
  Testing: pytest with pytest-cov, Vitest, Playwright, Docker Compose runtime checks, Ruff security rules, mypy, pip-audit, and pinned Semgrep CE are available.
  Style: Python uses Ruff and strict mypy; frontend is a Vite React chart shell with strict TypeScript.
testing:
  detected: 2026-07-19
  runner: pytest
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  quality:
    linter: ruff
    type_checker: mypy
    formatter: false
rules:
  proposal:
    - Include rollback plan for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale.
  tasks:
    - Group by phase and keep tasks small enough for one session.
  apply:
    - Follow existing code patterns.
    - Do not invent dependencies or stack details.
  verify:
    - Prefer automated checks when the project later defines them.
  archive:
    - Warn before merging destructive deltas.
