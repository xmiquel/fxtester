services:
  backend:
    image: fxtester-backend:${IMAGE_VERSION:-local}
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${MARKET_DATABASE_PATH:-D:/repos_2026/98-tstlocal/data/market.duckdb}
        target: /data/market.duckdb
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "set -eu; html=$$(wget -qO- http://127.0.0.1:5173/); printf '%s' \"$$html\" | grep -Fq '<div id=\"root\"></div>'; printf '%s' \"$$html\" | grep -Fq '/src/main.tsx'; wget -qO- http://127.0.0.1:5173/src/main.tsx | grep -Fq 'createRoot'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
